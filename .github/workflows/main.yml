          if [[ "$FILE_DESC" == *"XZ compressed"* ]]; then
              mv custom_rom_package c.img.xz
              unxz c.img.xz
              mv c.img custom_system.img

          elif [[ "$FILE_DESC" == *"Zip archive"* ]]; then
              unzip -o custom_rom_package

          elif [[ "$FILE_DESC" == *"7-zip archive"* ]]; then
              7z x custom_rom_package

          elif [[ "$FILE_DESC" == *"gzip compressed"* ]]; then
              mv custom_rom_package c.img.gz
              gzip -d c.img.gz
              mv c.img custom_system.img

          else
              echo "Assuming raw image..."
              mv custom_rom_package custom_system.img
          fi

          if [ ! -f "custom_system.img" ]; then
              echo "==> Searching for extracted .img file..."
              IMG_FILE=$(find . -type f -name "*.img" ! -name "stock_super_sparse.img" -printf "%s\t%p\n" | sort -n | tail -1 | cut -f2-)

              if [ -z "$IMG_FILE" ]; then
                  echo "✗ Error: No .img file found after extraction!"
                  ls -R
                  exit 1
              fi

              echo "==> Found image: $IMG_FILE"
              mv "$IMG_FILE" custom_system.img
          fi

          echo "==> Custom system image prepared: custom_system.img"

      - name: Download ASRControl APK
        run: |
          cd work
          echo "==> Downloading ASRControl APK..."
          wget -q -O ASRControl.apk "https://github.com/minhmc2007/minhmc2007/releases/download/v0.0.1/app-debug.apk" || echo "Warning: APK download failed."
      
      - name: System Branding (APK, pfetch, build.prop)
        run: |
          cd work
          if simg2img custom_system.img custom_system.raw 2>/dev/null; then
            mv custom_system.raw custom_system.img
          fi

          # Expand image size by 100MB to allow adding branding files and APKs; DO NOT REMOVE THIS, or you will violate the project's license, iif this section not work well for your firmware, you can remove it BUT YOU MUST CREDIT ME (Minhmc2077) as the author of this project. 
          if file custom_system.img | grep -qi "ext"; then
            echo "==> Detected ext filesystem. Expanding custom_system.img by 100MB..."
            truncate -s +100M custom_system.img
            sudo e2fsck -f -y custom_system.img || true
            sudo resize2fs custom_system.img
          else
            echo "==> custom_system.img is not an ext filesystem, skipping resize."
          fi

          chmod +x ../scripts/brand_system.sh
          sudo ../scripts/brand_system.sh \
            --image custom_system.img \
            --apk ASRControl.apk \
