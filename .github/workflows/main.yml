        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 >/dev/null; then
            report_error "Super image is missing from AP firmware" "The AP archive does not contain a super.img LZ4 image." "Use a full, compatible Samsung firmware package that includes super.img.lz4."
          fi

          rm stock_firmware.zip
          echo "==> Extracting super.img.lz4..."
          tar -xf "$AP_FILENAME" --wildcards '*super.img*.lz4' || report_error "Could not extract super.img.lz4" "The super image could not be extracted from the AP archive." "Try downloading the firmware ZIP again and verify that the file is complete."
          rm "$AP_FILENAME"

          SUPER_LZ4=$(find . -maxdepth 1 -type f -name '*super.img*.lz4' -print -quit)
          if [ -z "$SUPER_LZ4" ] || [ ! -s "$SUPER_LZ4" ]; then
            report_error "Extracted super image is missing" "No non-empty super.img LZ4 file was produced from the AP archive." "Provide a complete Samsung firmware ZIP containing AP_*.tar.md5 with super.img.lz4 inside."
          fi

          echo "==> Decompressing LZ4..."
          lz4 -d "$SUPER_LZ4" stock_super_sparse.img || report_error "Could not decompress super image" "The extracted super.img.lz4 file is invalid or incomplete." "Download the complete firmware ZIP again and check that it matches the target device."
          rm "$SUPER_LZ4"
          if [ ! -s "stock_super_sparse.img" ]; then
            report_error "Stock super image is empty" "Decompression did not produce a usable stock super image." "Use a complete, uncorrupted Samsung firmware ZIP."
          fi

