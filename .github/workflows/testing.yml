name: Android Super Repack + OEM Port 

on:
  workflow_dispatch:
    inputs:
      # --- Base Firmware (Stock Super) ---
      base_model:
        description: 'Base: Samsung Model (e.g., SM-A155F)'
        required: true
        type: string
      base_csc:
        description: 'Base: CSC / Region (e.g., XXV)'
        required: true
        type: string
        default: 'XXV'
      base_imei:
        description: 'Base: IMEI (15-digit, matching the base model)'
        required: true
        type: string

      # --- Custom ROM Source (System Image) ---
      enable_oem_port:
        description: 'Mode: Port an OEM ROM? (True = Porting, False = GSI/Custom ROM)'
        required: true
        type: boolean
        default: false

      porting_tool:
        description: 'Port Tool: Select Porting Script'
        required: false
        type: choice
        options:
          - Link2GSI
          - ErfanGSIs
        default: 'Link2GSI'
      
      # If Mode = Porting (Source Options)
      port_firmware_url:
        description: 'Port Source: Custom Firmware URL (Alternative to Samloader, for ErfanGSIs)'
        required: false
        type: string

      port_model:
        description: 'Port Source: Samsung Model (e.g., SM-S918B, if downloading via Samloader)'
        required: false
        type: string
      port_csc:
        description: 'Port Source: CSC / Region (e.g., XXV, if downloading via Samloader)'
        required: false
        type: string
        default: 'XXV'
      port_imei:
        description: 'Port Source: IMEI (15-digit, if downloading via Samloader)'
        required: false
        type: string

      port_rom_type:
        description: 'Port Source: ROM Type'
        required: false
        type: choice
        options:
          - OneUI
          - Pixel
          - MIUI
          - OxygenOS
          - Flyme
          - Moto
          - ColorOS
          - Generic
        default: 'OneUI'

      # If Mode = GSI/Custom ROM
      custom_system_url:
        description: 'GSI Source: System Image URL (Lineage, PixelExp, etc.)'
        required: false
        type: string

      # --- Options ---
      enable_erofs_compression:
        description: 'Compress System.img via EROFS (Highly Recommended, keeps image size within super.img bounds)'
        required: true
        type: boolean
        default: true
      upload_to_release:
        description: 'Upload Result to GitHub Release?'
        required: true
        type: boolean
        default: false
      silent_mode:
        description: 'Silent Mode (Legacy flag, logs minimized)'
        required: false
        type: boolean
        default: true

jobs:
  repack-super:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # --------------------------------------------------------------------------
    # 1. Environment Setup
    # --------------------------------------------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Optimize Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies
      run: |
        echo "==> Installing Tools..."
        sudo apt-get update -qq
        # Android & Filesystem Tools
        sudo apt-get install -y -qq android-sdk-libsparse-utils tar xz-utils liblz4-tool unzip p7zip-full file wget curl megatools f2fs-tools erofs-utils cpio rsync jq
        # Porting Support Tools
        sudo apt-get install -y -qq unace unrar zip p7zip-rar sharutils rar uudeview mpack arj cabextract rename liblzma-dev brotli lz4 protobuf-compiler git gawk python3-pip
        
        # Python Libs & Samloader
        pip3 install -q gdown backports.lzma protobuf twrpdtgen extract-dtb pycryptodome --break-system-packages
        pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages

    - name: Prepare Workspace & Script
      run: |
        mkdir -p work
        
        # Ensure the repack script is executable
        if [ -f "./scripts/repacksuper_lite.sh" ]; then
          chmod +x ./scripts/repacksuper_lite.sh
        else
          echo "::error::repacksuper_lite.sh not found in scripts/ directory."
          exit 1
        fi
        
        # Ensure the EROFS compress script is executable
        if [ -f "./scripts/compress_system_img.sh" ]; then
          chmod +x ./scripts/compress_system_img.sh
        fi

    # --------------------------------------------------------------------------
    # 2. Base Firmware Acquisition (Stock Super via Samloader)
    # --------------------------------------------------------------------------
    - name: Download Base Firmware
      run: |
        cd work
        MODEL="${{ github.event.inputs.base_model }}"
        CSC="${{ github.event.inputs.base_csc }}"
        IMEI="${{ github.event.inputs.base_imei }}"
        
        echo "==> Checking Base Firmware Version..."
        VERSION_BASE=$(python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" checkupdate 2>/dev/null)
        if [ -z "$VERSION_BASE" ]; then
          echo "::error::Failed to fetch version for Base Model: $MODEL ($CSC). Please check the model name, CSC, or IMEI."
          exit 1
        fi
        echo "Base Firmware Version: $VERSION_BASE"
        
        echo "==> Downloading Base Firmware..."
        python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" download -v "$VERSION_BASE" -O .
        
        echo "==> Checking downloaded files..."
        ls -la
        
        # Auto-detect whether samloader downloaded an encrypted file or decrypted it on-the-fly
        ENC_FILE=$(find . -maxdepth 1 -name "*.enc*" | head -n1)
        if [ -n "$ENC_FILE" ]; then
          echo "==> Found encrypted file: $ENC_FILE. Decrypting manually..."
          python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" decrypt -v "$VERSION_BASE" -i "$ENC_FILE" -o stock_firmware.zip
          rm -f "$ENC_FILE"
        else
          echo "==> No encrypted file found. Checking for on-the-fly decrypted ZIP..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" ! -name "stock_firmware.zip" | head -n1)
          if [ -n "$ZIP_FILE" ]; then
            echo "==> Found decrypted ZIP file: $ZIP_FILE. Preparing..."
            mv "$ZIP_FILE" stock_firmware.zip
          else
            echo "::error::No firmware files (.enc or .zip) found after download."
            exit 1
          fi
        fi
        
        echo "==> Extracting Super Partition..."
        # Extract AP file
        AP_FILE=$(unzip -l stock_firmware.zip | grep -ioE "AP_.*\.tar\.md5" | head -n1)
        unzip -o -j stock_firmware.zip "$AP_FILE"
        rm stock_firmware.zip
        
        # Extract and Decompress Super
        tar -xf "$AP_FILE" --wildcards '*super.img.lz4'
        lz4 -d super.img.lz4 stock_super_sparse.img
        rm super.img.lz4 "$AP_FILE"

    # --------------------------------------------------------------------------
    # 3. Custom System Acquisition (Port or Download)
    # --------------------------------------------------------------------------
    - name: Generate Custom System (Porting Mode)
      if: github.event.inputs.enable_oem_port == 'true'
      run: |
        chmod +x ./scripts/oem_port.sh

        PORT_ARGS=()
        PORT_ARGS+=("work" "${{ github.event.inputs.porting_tool }}" "${{ github.event.inputs.port_rom_type }}")

        if [ -n "${{ github.event.inputs.port_firmware_url }}" ]; then
          PORT_ARGS+=(--url "${{ github.event.inputs.port_firmware_url }}")
        else
          PORT_ARGS+=(--samloader "${{ github.event.inputs.port_model }}" "${{ github.event.inputs.port_csc }}" "${{ github.event.inputs.port_imei }}")
        fi

        ./scripts/oem_port.sh "${PORT_ARGS[@]}"

    - name: Patch Firmware Partitions (OEM Port Only)
      if: github.event.inputs.enable_oem_port == 'true'
      run: |
        echo "==> Patching firmware partitions for ported ROM compatibility..."
        chmod +x ./scripts/patch_firmware.sh
        sudo ./scripts/patch_firmware.sh --super work/stock_super_sparse.img work/patched_partitions

    - name: Download Custom System (GSI Mode)
      if: github.event.inputs.enable_oem_port == 'false'
      run: |
        echo "==> GSI/ROM Download Mode."
        URL="${{ github.event.inputs.custom_system_url }}"
        if [ -z "$URL" ]; then echo "::error::Custom System URL is required." && exit 1; fi

        CLEAN_URL="${URL%%\?*}"
        ROM_NAME=$(basename "$CLEAN_URL")
        echo "ROM_NAME=$ROM_NAME" >> $GITHUB_ENV
        
        cd work
        wget -q -O rom_package "$URL"
        
        # Detect and Extract
        TYPE=$(file -b rom_package)
        echo "File Type: $TYPE"
        
        if [[ "$TYPE" == *"XZ compressed"* ]]; then mv rom_package s.xz; unxz s.xz; mv s custom_system.img
        elif [[ "$TYPE" == *"gzip compressed"* ]]; then mv rom_package s.gz; gzip -d s.gz; mv s custom_system.img
        elif [[ "$TYPE" == *"Zip archive"* ]]; then unzip -o rom_package
        elif [[ "$TYPE" == *"7-zip"* ]]; then 7z x rom_package
        else mv rom_package custom_system.img; fi
        
        # Ensure we have the .img
        if [ ! -f "custom_system.img" ]; then
           FIND=$(find . -maxdepth 2 -name "*.img" ! -name "stock_super_sparse.img" | head -n1)
           if [ -n "$FIND" ]; then mv "$FIND" custom_system.img; else echo "::error::Extraction failed." && exit 1; fi
         fi

    # --------------------------------------------------------------------------
    # 3.5. Download Branding Assets (REMOVE = VIOLATE LICENSE)
    # --------------------------------------------------------------------------
    - name: Download ASRControl APK
      run: |
        wget -q -O work/ASRControl.apk "https://github.com/minhmc2007/minhmc2007/releases/download/v0.0.1/app-debug.apk" || echo "Warning: APK download failed."

    # --------------------------------------------------------------------------
    # 3.6. EROFS System Image Compression (Safe Mode)
    # --------------------------------------------------------------------------
    - name: Compress System Image (EROFS)
      if: github.event.inputs.enable_erofs_compression == 'true'
      run: |
        echo "==> EROFS Compression Enabled. Processing custom_system.img..."
        
        # Download the script if it does not exist in the root repo
        if [ ! -f "./scripts/compress_system_img.sh" ]; then
          echo "compress_system_img.sh not found locally. Downloading from Custom-Super-Maker repository..."
          wget -q https://raw.githubusercontent.com/minhmc2007/Custom-Super-Maker/main/scripts/compress_system_img.sh -O scripts/compress_system_img.sh
        fi
        
        chmod +x ./scripts/compress_system_img.sh
        
        # Execute compression script with a DIFFERENT output name to prevent corruption
        sudo ./scripts/compress_system_img.sh work/custom_system.img work/custom_system_compressed.img
        
        # Verification & Safe Replace
        if [ -f "work/custom_system_compressed.img" ] && [ -s "work/custom_system_compressed.img" ]; then
           echo "==> Compression successful. Replacing the original image safely..."
           sudo rm work/custom_system.img
           sudo mv work/custom_system_compressed.img work/custom_system.img
        else
           echo "::error::EROFS Compression failed! Compressed image is missing or empty."
           exit 1
        fi

    # --------------------------------------------------------------------------
    # 4. Super Partition Repack (The Core Logic)
    # --------------------------------------------------------------------------
    - name: Execute Repack Script
      run: |
        echo "==> Starting Repack Process..."
        
        # 1. Verify Inputs
        if [ ! -f "work/stock_super_sparse.img" ]; then echo "::error::Stock Super Image missing."; exit 1; fi
        if [ ! -f "work/custom_system.img" ]; then echo "::error::Custom System Image missing."; exit 1; fi
        
        # 2. Check if patched partitions exist (from OEM port mode)
        PATCHED_FLAG=""
        if [ -d "work/patched_partitions" ]; then
          echo "==> Found patched partitions directory. Using patched images instead of stock."
          PATCHED_FLAG="-P work/patched_partitions"
        elif [ -f "work/patched_vendor.img" ]; then
          echo "==> Found patched vendor image (legacy). Using it instead of stock vendor."
          PATCHED_FLAG="work/patched_vendor.img"
        fi
        
        # 3. Execute with Sudo (Required for EROFS/Mounting)
        sudo ./scripts/repacksuper_lite.sh \
          $PATCHED_FLAG \
          work/stock_super_sparse.img \
          work/custom_system.img \
          work/repacked_super.img
        
        # 4. Verify Output
        if [ ! -f "work/repacked_super.img" ]; then
           echo "::error::Repack script finished but output file is missing."
           exit 1
        fi

    # --------------------------------------------------------------------------
    # 5. Final Packaging & Upload
    # --------------------------------------------------------------------------
    - name: Compress and Prepare Package
      id: package
      run: |
        cd work
        mv repacked_super.img super.img
        TAR_NAME="super_repack_${{ github.run_id }}.tar"
        
        echo "==> Creating Tarball: $TAR_NAME"
        tar -cvf "$TAR_NAME" super.img
        
        echo "tar_path=work/$TAR_NAME" >> $GITHUB_OUTPUT

    - name: Upload Repacked Image to GoFile
      id: upload-gofile
      run: |
        echo "==> Uploading final package to GoFile..."
        FILE_PATH="${{ steps.package.outputs.tar_path }}"
        if [ ! -f "$FILE_PATH" ]; then
          echo "::error::Package file not found at $FILE_PATH"
          exit 1
        fi

        SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
        if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
          echo "::error::Failed to get GoFile server"
          exit 1
        fi

        echo "==> Uploading via server: $SERVER"
        LINK=$(curl -# -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/uploadFile" | jq -r '.data|.downloadPage') 2>&1

        if [ -n "$LINK" ] && [ "$LINK" != "null" ]; then
          echo "==> Upload succeeded!"
          echo "::notice::Download Link: $LINK"
          echo "gofile_url=$LINK" >> $GITHUB_OUTPUT

          echo "### 🚀 Repack Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "The repacked partition package has been uploaded successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GoFile Download Link:** [$LINK]($LINK)" >> $GITHUB_STEP_SUMMARY
        else
          echo "::error::GoFile upload failed."
          exit 1
        fi

    - name: Upload to Release (Optional)
      if: github.event.inputs.upload_to_release == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GOFILE_URL="${{ steps.upload-gofile.outputs.gofile_url }}"
        BASE_MODEL="${{ github.event.inputs.base_model }}"
        BASE_CSC="${{ github.event.inputs.base_csc }}"
        PORT_MODE="${{ github.event.inputs.enable_oem_port }}"
        PORT_TOOL="${{ github.event.inputs.porting_tool }}"
        ROM_TYPE="${{ github.event.inputs.port_rom_type }}"

        if [ "$PORT_MODE" = "true" ]; then
          PORT_MODEL="${{ github.event.inputs.port_model }}"
          TITLE="CSM Build - ${BASE_MODEL} → ${PORT_MODEL} (${ROM_TYPE})"
          BODY="**Custom-Super-Maker Build**  
        Base: \`${BASE_MODEL} (${BASE_CSC})\`  
        Port: \`${PORT_MODEL}\` → \`${ROM_TYPE}\` via \`${PORT_TOOL}\`"
        else
          GSI_NAME="${{ env.ROM_NAME }}"
          TITLE="CSM Build - ${BASE_MODEL} (${BASE_CSC}) - ${GSI_NAME}"
          BODY="**Custom-Super-Maker Build**  
        Base: \`${BASE_MODEL} (${BASE_CSC})\`  
        GSI: \`${GSI_NAME}\`"
        fi

        BODY="${BODY}

        **GoFile Download:** [${GOFILE_URL}](${GOFILE_URL})"

        gh release create "build-${{ github.run_id }}" \
          --title "$TITLE" \
          --notes "$BODY" \
          --target "${{ github.sha }}"
