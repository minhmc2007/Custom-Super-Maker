name: Android Super Repack + OEM Port 

on:
  workflow_dispatch:
    inputs:
      # --- Base Firmware (Stock Super) ---
      base_model:
        description: 'Base: Samsung Model (e.g., SM-A155F)'
        required: true
        type: string
      base_csc:
        description: 'Base: CSC / Region (e.g., XXV)'
        required: true
        type: string
        default: 'XXV'
      base_imei:
        description: 'Base: IMEI (15-digit, matching the base model)'
        required: true
        type: string

      # --- Custom ROM Source (System Image) ---
      enable_oem_port:
        description: 'Mode: Port an OEM ROM? (True = Porting, False = GSI/Custom ROM)'
        required: true
        type: boolean
        default: false

      porting_tool:
        description: 'Port Tool: Select Porting Script'
        required: false
        type: choice
        options:
          - Link2GSI
          - ErfanGSIs
        default: 'Link2GSI'
      
      # If Mode = Porting (Source Options)
      port_firmware_url:
        description: 'Port Source: Custom Firmware URL (Alternative to Samloader, for ErfanGSIs)'
        required: false
        type: string

      port_model:
        description: 'Port Source: Samsung Model (e.g., SM-S918B, if downloading via Samloader)'
        required: false
        type: string
      port_csc:
        description: 'Port Source: CSC / Region (e.g., XXV, if downloading via Samloader)'
        required: false
        type: string
        default: 'XXV'
      port_imei:
        description: 'Port Source: IMEI (15-digit, if downloading via Samloader)'
        required: false
        type: string

      port_rom_type:
        description: 'Port Source: ROM Type'
        required: false
        type: choice
        options:
          - OneUI
          - Pixel
          - MIUI
          - OxygenOS
          - Flyme
          - Moto
          - ColorOS
          - Generic
        default: 'OneUI'

      # If Mode = GSI/Custom ROM
      custom_system_url:
        description: 'GSI Source: System Image URL (Lineage, PixelExp, etc.)'
        required: false
        type: string

      # --- Options ---
      enable_erofs_compression:
        description: 'Compress System.img via EROFS (Highly Recommended, keeps image size within super.img bounds)'
        required: true
        type: boolean
        default: true
      upload_to_release:
        description: 'Upload Result to GitHub Release?'
        required: true
        type: boolean
        default: false
      silent_mode:
        description: 'Silent Mode (Legacy flag, logs minimized)'
        required: false
        type: boolean
        default: true

jobs:
  repack-super:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # --------------------------------------------------------------------------
    # 1. Environment Setup
    # --------------------------------------------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Optimize Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies
      run: |
        echo "==> Installing Tools..."
        sudo apt-get update -qq
        # Android & Filesystem Tools
        sudo apt-get install -y -qq android-sdk-libsparse-utils tar xz-utils liblz4-tool unzip p7zip-full file wget curl megatools f2fs-tools erofs-utils cpio rsync jq
        # Porting Support Tools
        sudo apt-get install -y -qq unace unrar zip p7zip-rar sharutils rar uudeview mpack arj cabextract rename liblzma-dev brotli lz4 protobuf-compiler git gawk python3-pip
        
        # Python Libs & Samloader
        pip3 install -q gdown backports.lzma protobuf twrpdtgen extract-dtb pycryptodome --break-system-packages
        pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages

    - name: Prepare Workspace & Script
      run: |
        mkdir -p work
        
        # Ensure the repack script is executable
        if [ -f "./repacksuper_lite.sh" ]; then
          chmod +x ./repacksuper_lite.sh
        else
          echo "::error::repacksuper_lite.sh not found in repository root."
          exit 1
        fi
        
        # Ensure the EROFS compress script is executable
        if [ -f "./compress_system_img.sh" ]; then
          chmod +x ./compress_system_img.sh
        fi

    # --------------------------------------------------------------------------
    # 2. Base Firmware Acquisition (Stock Super via Samloader)
    # --------------------------------------------------------------------------
    - name: Download Base Firmware
      run: |
        cd work
        MODEL="${{ github.event.inputs.base_model }}"
        CSC="${{ github.event.inputs.base_csc }}"
        IMEI="${{ github.event.inputs.base_imei }}"
        
        echo "==> Checking Base Firmware Version..."
        VERSION_BASE=$(python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" checkupdate 2>/dev/null)
        if [ -z "$VERSION_BASE" ]; then
          echo "::error::Failed to fetch version for Base Model: $MODEL ($CSC). Please check the model name, CSC, or IMEI."
          exit 1
        fi
        echo "Base Firmware Version: $VERSION_BASE"
        
        echo "==> Downloading Base Firmware..."
        python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" download -v "$VERSION_BASE" -O .
        
        echo "==> Checking downloaded files..."
        ls -la
        
        # Auto-detect whether samloader downloaded an encrypted file or decrypted it on-the-fly
        ENC_FILE=$(find . -maxdepth 1 -name "*.enc*" | head -n1)
        if [ -n "$ENC_FILE" ]; then
          echo "==> Found encrypted file: $ENC_FILE. Decrypting manually..."
          python3 -m samloader -m "$MODEL" -r "$CSC" -i "$IMEI" decrypt -v "$VERSION_BASE" -i "$ENC_FILE" -o stock_firmware.zip
          rm -f "$ENC_FILE"
        else
          echo "==> No encrypted file found. Checking for on-the-fly decrypted ZIP..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" ! -name "stock_firmware.zip" | head -n1)
          if [ -n "$ZIP_FILE" ]; then
            echo "==> Found decrypted ZIP file: $ZIP_FILE. Preparing..."
            mv "$ZIP_FILE" stock_firmware.zip
          else
            echo "::error::No firmware files (.enc or .zip) found after download."
            exit 1
          fi
        fi
        
        echo "==> Extracting Super Partition..."
        # Extract AP file
        AP_FILE=$(unzip -l stock_firmware.zip | grep -ioE "AP_.*\.tar\.md5" | head -n1)
        unzip -o -j stock_firmware.zip "$AP_FILE"
        rm stock_firmware.zip
        
        # Extract and Decompress Super
        tar -xf "$AP_FILE" --wildcards '*super.img.lz4'
        lz4 -d super.img.lz4 stock_super_sparse.img
        rm super.img.lz4 "$AP_FILE"

    # --------------------------------------------------------------------------
    # 3. Custom System Acquisition (Port or Download)
    # --------------------------------------------------------------------------
    - name: Generate Custom System (Porting Mode)
      if: github.event.inputs.enable_oem_port == 'true'
      run: |
        echo "==> Porting Mode Enabled."
        
        # 1. Acquire Port Firmware Zip
        if [ -n "${{ github.event.inputs.port_firmware_url }}" ]; then
          echo "==> Downloading Port Firmware via URL..."
          wget -q --content-disposition -O work/port_firmware.zip "${{ github.event.inputs.port_firmware_url }}"
        else
          echo "==> Fetching Port Firmware via Samloader..."
          PORT_MODEL="${{ github.event.inputs.port_model }}"
          PORT_CSC="${{ github.event.inputs.port_csc }}"
          PORT_IMEI="${{ github.event.inputs.port_imei }}"
          
          if [ -z "$PORT_MODEL" ] || [ -z "$PORT_CSC" ] || [ -z "$PORT_IMEI" ]; then
            echo "::error::Both Porting URL and Samloader parameters (Model, CSC, IMEI) are missing."
            exit 1
          fi
          
          mkdir -p port_fw && cd port_fw
          echo "==> Checking Port Firmware Version..."
          VERSION_PORT=$(python3 -m samloader -m "$PORT_MODEL" -r "$PORT_CSC" -i "$PORT_IMEI" checkupdate 2>/dev/null)
          if [ -z "$VERSION_PORT" ]; then
            echo "::error::Failed to fetch version for Port Model: $PORT_MODEL ($PORT_CSC). Check model, CSC, or IMEI."
            exit 1
          fi
          echo "Port Firmware Version: $VERSION_PORT"
          
          echo "==> Downloading Port Firmware..."
          python3 -m samloader -m "$PORT_MODEL" -r "$PORT_CSC" -i "$PORT_IMEI" download -v "$VERSION_PORT" -O .
          
          echo "==> Checking downloaded files..."
          ls -la
          
          # Auto-detect whether samloader downloaded an encrypted file or decrypted it on-the-fly
          ENC_FILE_PORT=$(find . -maxdepth 1 -name "*.enc*" | head -n1)
          if [ -n "$ENC_FILE_PORT" ]; then
            echo "==> Found encrypted port file: $ENC_FILE_PORT. Decrypting manually..."
            python3 -m samloader -m "$PORT_MODEL" -r "$PORT_CSC" -i "$PORT_IMEI" decrypt -v "$VERSION_PORT" -i "$ENC_FILE_PORT" -o port_firmware.zip
            rm -f "$ENC_FILE_PORT"
          else
            echo "==> No encrypted port file found. Checking for on-the-fly decrypted ZIP..."
            ZIP_FILE_PORT=$(find . -maxdepth 1 -name "*.zip" ! -name "port_firmware.zip" | head -n1)
            if [ -n "$ZIP_FILE_PORT" ]; then
              echo "==> Found decrypted ZIP file: $ZIP_FILE_PORT. Preparing..."
              mv "$ZIP_FILE_PORT" port_firmware.zip
            else
              echo "::error::No port firmware files (.enc or .zip) found after download."
              exit 1
            fi
          fi
          
          mv port_firmware.zip ../work/port_firmware.zip
          cd ..
          rm -rf port_fw
        fi

        # 2. Execute selected Porting Tool
        if [[ "${{ github.event.inputs.porting_tool }}" == "Link2GSI" ]]; then
          echo "==> Porting using Link2GSI..."
          git clone https://github.com/minhmc2007/Link2GSI
          cd Link2GSI
          
          # Fix Submodules
          rm -rf Tools/Firmware_extractor
          git clone https://github.com/erfanoabdi/Firmware_extractor.git Tools/Firmware_extractor
          
          # Recursively patch all unlz4 calls inside Link2GSI scripts to force file outputs
          echo "==> Patching all unlz4 extraction commands..."
          find . -name "*.sh" -exec sed -i 's/unlz4 "$tmpdir\/$file"/unlz4 -m "$tmpdir\/$file"/g' {} +
          
          # Execute Port
          sudo bash LinkToGSI.sh "../work/port_firmware.zip" "${{ github.event.inputs.port_rom_type }}"
          
          # Locate Output
          IMG=$(find Output -name "*.img" | head -n1)
          if [ -z "$IMG" ]; then echo "::error::Link2GSI failed to produce an image." && exit 1; fi
          
          # Move to work dir
          sudo mv "$IMG" ../work/custom_system.img
          sudo chown $(whoami) ../work/custom_system.img
          cd ..
          sudo rm -rf Link2GSI
        else
          echo "==> Porting using ErfanGSIs..."
          git clone --recurse-submodules https://github.com/erfanoabdi/ErfanGSIs.git
          cd ErfanGSIs
          
          # Setup ErfanGSIs requirements (using non-interactive sed patch)
          echo "==> Setting up requirements for ErfanGSIs..."
          sed -i 's/apt install/apt install -y/g' setup.sh
          
          # Patch outdated packages & pycrypto compilation issues on Python 3.12+
          sed -i 's/python-pip/python3-pip/g' setup.sh
          sed -i 's/pycrypto/pycryptodome/g' setup.sh
          sed -i 's/pip install/pip install --break-system-packages/g' setup.sh
          
          sudo bash setup.sh
          
          # Recursively patch all unlz4 calls inside ErfanGSIs scripts to force file outputs
          echo "==> Patching all unlz4 extraction commands..."
          find . -name "*.sh" -exec sed -i 's/unlz4 "$tmpdir\/$file"/unlz4 -m "$tmpdir\/$file"/g' {} +
          
          # Run ErfanGSIs on the local zip
          echo "==> Running url2GSI.sh..."
          sudo ./url2GSI.sh "../work/port_firmware.zip" "${{ github.event.inputs.port_rom_type }}"
          
          # Find output image in output or out or root directory
          echo "==> Locating ErfanGSIs output image..."
          IMG=$(find output out . -name "*GSI*.img" -o -name "*Aonly*.img" -o -name "*AB*.img" 2>/dev/null | head -n1)
          
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then 
            echo "::error::ErfanGSIs failed to produce an image."
            exit 1
          fi
          
          echo "Found GSI image: $IMG"
          # Move to work dir
          sudo mv "$IMG" ../work/custom_system.img
          sudo chown $(whoami) ../work/custom_system.img
          cd ..
          sudo rm -rf ErfanGSIs
        fi
        
        # Cleanup source firmware zip
        sudo rm -f work/port_firmware.zip

    - name: Download Custom System (GSI Mode)
      if: github.event.inputs.enable_oem_port == 'false'
      run: |
        echo "==> GSI/ROM Download Mode."
        URL="${{ github.event.inputs.custom_system_url }}"
        if [ -z "$URL" ]; then echo "::error::Custom System URL is required." && exit 1; fi
        
        cd work
        wget -q -O rom_package "$URL"
        
        # Detect and Extract
        TYPE=$(file -b rom_package)
        echo "File Type: $TYPE"
        
        if [[ "$TYPE" == *"XZ compressed"* ]]; then mv rom_package s.xz; unxz s.xz; mv s custom_system.img
        elif [[ "$TYPE" == *"gzip compressed"* ]]; then mv rom_package s.gz; gzip -d s.gz; mv s custom_system.img
        elif [[ "$TYPE" == *"Zip archive"* ]]; then unzip -o rom_package
        elif [[ "$TYPE" == *"7-zip"* ]]; then 7z x rom_package
        else mv rom_package custom_system.img; fi
        
        # Ensure we have the .img
        if [ ! -f "custom_system.img" ]; then
           FIND=$(find . -maxdepth 2 -name "*.img" ! -name "stock_super_sparse.img" | head -n1)
           if [ -n "$FIND" ]; then mv "$FIND" custom_system.img; else echo "::error::Extraction failed." && exit 1; fi
        fi

    # --------------------------------------------------------------------------
    # 3.5. EROFS System Image Compression (Safe Mode)
    # --------------------------------------------------------------------------
    - name: Compress System Image (EROFS)
      if: github.event.inputs.enable_erofs_compression == 'true'
      run: |
        echo "==> EROFS Compression Enabled. Processing custom_system.img..."
        
        # Download the script if it does not exist in the root repo
        if [ ! -f "./compress_system_img.sh" ]; then
          echo "compress_system_img.sh not found locally. Downloading from Custom-Super-Maker repository..."
          wget -q https://raw.githubusercontent.com/minhmc2007/Custom-Super-Maker/main/compress_system_img.sh -O compress_system_img.sh
        fi
        
        chmod +x compress_system_img.sh
        
        # Execute compression script with a DIFFERENT output name to prevent corruption
        sudo ./compress_system_img.sh work/custom_system.img work/custom_system_compressed.img
        
        # Verification & Safe Replace
        if [ -f "work/custom_system_compressed.img" ] && [ -s "work/custom_system_compressed.img" ]; then
           echo "==> Compression successful. Replacing the original image safely..."
           sudo rm work/custom_system.img
           sudo mv work/custom_system_compressed.img work/custom_system.img
        else
           echo "::error::EROFS Compression failed! Compressed image is missing or empty."
           exit 1
        fi

    # --------------------------------------------------------------------------
    # 4. Super Partition Repack (The Core Logic)
    # --------------------------------------------------------------------------
    - name: Execute Repack Script
      run: |
        echo "==> Starting Repack Process..."
        
        # 1. Verify Inputs
        if [ ! -f "work/stock_super_sparse.img" ]; then echo "::error::Stock Super Image missing."; exit 1; fi
        if [ ! -f "work/custom_system.img" ]; then echo "::error::Custom System Image missing."; exit 1; fi
        
        # 2. Execute with Sudo (Required for EROFS/Mounting)
        sudo ./repacksuper_lite.sh \
          work/stock_super_sparse.img \
          work/custom_system.img \
          work/repacked_super.img
        
        # 3. Verify Output
        if [ ! -f "work/repacked_super.img" ]; then
           echo "::error::Repack script finished but output file is missing."
           exit 1
        fi

    # --------------------------------------------------------------------------
    # 5. Final Packaging & Upload
    # --------------------------------------------------------------------------
    - name: Compress and Prepare Package
      id: package
      run: |
        cd work
        mv repacked_super.img super.img
        TAR_NAME="super_repack_${{ github.run_id }}.tar"
        
        echo "==> Creating Tarball: $TAR_NAME"
        tar -cvf "$TAR_NAME" super.img
        
        echo "tar_path=work/$TAR_NAME" >> $GITHUB_OUTPUT

    - name: Upload Repacked Image to GoFile
      run: |
        echo "==> Uploading final package to GoFile..."
        FILE_PATH="${{ steps.package.outputs.tar_path }}"
        if [ ! -f "$FILE_PATH" ]; then
          echo "::error::Package file not found at $FILE_PATH"
          exit 1
        fi
        
        # Query best available GoFile server, fallback to the global upload endpoint if none found
        SERVER=$(curl -s https://api.gofile.io/getServer | jq -r '.data.server')
        if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
          echo "==> Server query empty. Falling back to global upload proxy..."
          RESPONSE=$(curl -s -X POST "https://upload.gofile.io/uploadfile" -F "file=@$FILE_PATH")
        else
          echo "==> Uploading via server: $SERVER"
          RESPONSE=$(curl -s -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/uploadFile")
        fi
        
        # Parse download page link
        DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
        if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
          echo "==> Upload succeeded!"
          echo "::notice::Download Link: $DOWNLOAD_URL"
          
          # Print formatting directly to the step summary page
          echo "### 🚀 Repack Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "The repacked partition package has been uploaded successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GoFile Download Link:** [$DOWNLOAD_URL]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
        else
          echo "::error::GoFile upload failed. API Response: $RESPONSE"
          exit 1
        fi

    - name: Upload to Release (Optional)
      if: github.event.inputs.upload_to_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_id }}
        files: ${{ steps.package.outputs.tar_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
